[workspace]
resolver = "2"
members = [
    "crates/atlas-core",
    "crates/atlas-web",
    "crates/atlas-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false }
bytemuck = { version = "1.21", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

